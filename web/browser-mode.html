<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>mapyourmind</title>
    <!-- Shown in the app window while mapyourmind is open in a browser tab.
         The native shell fills it in through window.setBrowserStatus. -->
    <style>
      @font-face { font-family: "Inter"; font-weight: 100 900; src: url(assets/InterVariable.woff2) format("woff2"); }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { display: flex; align-items: center; justify-content: center; background: #15233b; color: #fff; font: 14px "Inter", -apple-system, sans-serif; -webkit-user-select: none; user-select: none; }
      main { width: 460px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
      .icon { width: 56px; height: 56px; border-radius: 28px; background: #23416c; display: flex; align-items: center; justify-content: center; }
      h1 { margin: 0; font-size: 24px; font-weight: 700; }
      p { margin: 0; line-height: 1.5; color: #b7c6da; }
      .link { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; background: #1f3050; border: 1px solid #2d4468; border-radius: 10px; }
      .link.highlight { border-color: #2474d0; }
      .link span { flex: 1; text-align: left; font: 14px ui-monospace, Menlo, monospace; -webkit-user-select: text; user-select: text; }
      button { font: inherit; font-weight: 500; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
      button:focus-visible { outline: 2px solid #9cc3f5; outline-offset: 2px; }
      #copy { background: #2d4468; padding: 7px 12px; font-size: 13px; }
      #copy.done { background: #1d6b4f; }
      .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #b7c6da; }
      .dot { width: 8px; height: 8px; border-radius: 4px; background: #8fa3c0; }
      .dot.live { background: #3ecf8e; }
      .dot.busy { background: #e0a100; }
      .actions { display: flex; gap: 10px; margin-top: 6px; }
      .actions button { padding: 11px 20px; }
      .primary { background: #2474d0; }
      .primary:hover { background: #1d63b3; }
      .secondary { background: transparent; border: 1px solid #3a5278; }
      .secondary:hover { background: #1f3050; }
      button:disabled { opacity: 0.5; cursor: default; }
      small { font-size: 12px; color: #8fa3c0; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 9h18M7 6.5h.01M10 6.5h.01"></path></svg>
      </div>
      <div>
        <h1 id="title">Opening in your browser…</h1>
        <p id="body" style="margin-top: 8px"></p>
      </div>
      <div class="link" id="linkRow">
        <span id="url"></span>
        <button id="copy">Copy link</button>
      </div>
      <div class="status" role="status"><span class="dot" id="dot"></span><span id="status"></span></div>
      <div class="actions">
        <button id="openTab" class="secondary">Open tab again</button>
        <button id="back" class="primary">Back to app</button>
      </div>
      <small id="note">Editing here is paused, so only one place saves your work.</small>
    </main>
    <script src="browser-mode.js"></script>
  </body>
</html>
